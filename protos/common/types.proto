syntax = "proto3";

package common;

message EntityId {
  string value = 1;
}

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

message Pagination {
  int32 page = 1;
  int32 per_page = 2;
}

message PaginatedResult {
  int32 total = 1;
  int32 page = 2;
  int32 per_page = 3;
  int32 total_pages = 4;
}
